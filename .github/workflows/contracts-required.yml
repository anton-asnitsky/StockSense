# U1's required public-PR code check. The protected-base metadata guard below
# governs workflow configuration independently of this PR-code execution.
#
# Shaped by the policy U1 defines in tools/contracts/src/evidence.mjs
# (assertCiPolicy, BR6.7): no privileged checkout, no self-hosted runner on an
# untrusted trigger, read-only permissions on every job, and pinned actions.
# The separate protected-base PR policy workflow refuses proposed edits to
# .github after that workflow is merged and made a required check.
#
# Attestation is deliberately absent, though not for the reason recorded
# earlier. assertCiPolicy does not reject id-token: write as such - it refuses
# any write scope on an untrusted trigger, and allows id-token, attestations
# and contents on a trusted one. Since pull_request is a trigger here, this
# workflow stays read-only throughout; build provenance belongs in a separate
# push-only release workflow, which is the same conclusion on accurate grounds.
name: contracts-required

on:
  pull_request:
  push:
    branches: [main]

# Read-only for every job, which is what makes a fork pull request safe to run
# here: no secret is available and no token can write.
permissions:
  contents: read

jobs:
  contracts:
    name: U1 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the pull-request merge revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # A package records the commit its canonical bytes come from, and
          # provenance verification resolves that commit. A shallow clone has
          # only the merge head, so the recorded revision is absent and the
          # binding fails as SOURCE_REVISION_UNKNOWN - which is what the first
          # hosted run reported. Full history is a requirement here, not a
          # convenience.
          fetch-depth: 0
          persist-credentials: false

      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      # The exact engine tools/contracts/package.json pins, so the hosted run
      # satisfies the pin instead of overriding it as the local host must.
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tools/contracts/pnpm-lock.yaml

      # The image bakes in a copy of tools/contracts/src and its dependency
      # manifests, and the build is not bit-reproducible, so no image ID can be
      # committed: this job builds its own and the runner refuses any image
      # whose recorded digest does not match this checkout.
      - name: Build the pinned standards image
        id: standards-image
        working-directory: tools/contracts
        run: |
          id="$(node scripts/build-standards-image.mjs | grep -oE '^sha256:[0-9a-f]{64}$')"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build the pinned Kiota image
        id: kiota-image
        working-directory: tools/contracts
        run: |
          id="$(node scripts/build-kiota-image.mjs | grep -oE '^sha256:[0-9a-f]{64}$')"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Inventory and scan the exact built images
        env:
          STOCKSENSE_STANDARDS_IMAGE: ${{ steps.standards-image.outputs.id }}
          STOCKSENSE_KIOTA_IMAGE: ${{ steps.kiota-image.outputs.id }}
        run: node tools/contracts/scripts/image-evidence.mjs build

      - name: Retain image inventories and current vulnerability findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ github.sha }}
          path: tools/contracts/dist/image-evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify current findings against protected main ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOCKSENSE_STANDARDS_IMAGE: ${{ steps.standards-image.outputs.id }}
          STOCKSENSE_KIOTA_IMAGE: ${{ steps.kiota-image.outputs.id }}
        run: node tools/contracts/scripts/image-evidence.mjs verify

      - name: Retain ledger and scan binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-ledger-verification-${{ github.sha }}
          path: tools/contracts/dist/image-evidence/ledger-verification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Install from the frozen lockfile
        run: pnpm --dir tools/contracts install --frozen-lockfile

      # U1 defines assertCiPolicy but, until now, nothing ran it against this
      # repository's own workflows: the policy described a rule the repository
      # never applied. The changed paths come from git rather than from the
      # workflow being judged, so a pull request cannot describe itself as
      # touching nothing.
      #
      # Known limit, recorded rather than overstated: for pull_request the
      # workflow is taken from the pull request's own merge commit, so this step
      # cannot stop a pull request that deletes it. The push run below is the
      # backstop. pull_request_target would close that gap and is refused by
      # this very policy as CI_UNTRUSTED_TRIGGER, so the control is a guard
      # against accident rather than against a determined author.
      #
      # The event name and base revision arrive through the environment, never
      # interpolated into the script body, so no workflow expression can be
      # executed as shell.
      - name: Enforce the CI policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          policy() { node tools/contracts/scripts/check-ci-policy.mjs .github/workflows "$@"; }
          if [ "$EVENT_NAME" != pull_request ]; then
            policy
            exit 0
          fi
          changed=()
          while IFS= read -r path; do
            [ -n "$path" ] && changed+=("$path")
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          if [ ${#changed[@]} -eq 0 ]; then
            policy
          else
            policy --changed "${changed[@]}"
          fi

      # oasdiff is an approved pinned tool fetched by digest, not a vendored
      # dependency, so without this step the compatibility tests fail closed
      # with DIFFER_UNAVAILABLE. Setting it up gives real compatibility
      # evidence instead of a skip; the script verifies the published
      # SHA-256 for this platform before trusting the binary.
      - name: Set up the pinned differ
        run: pnpm --dir tools/contracts setup:oasdiff

      - name: Lint
        run: pnpm --dir tools/contracts lint

      - name: Type-check
        run: pnpm --dir tools/contracts type-check

      # The dedicated required scan job retains both reports, including red
      # results. Tests here stay focused on the contract implementation.

      - name: Unit tests
        run: pnpm --dir tools/contracts test:unit
        env:
          STOCKSENSE_STANDARDS_IMAGE: ${{ steps.standards-image.outputs.id }}

      # Container-backed, so this is the run that decides whether the pinned
      # validators agree with this checkout on a clean machine.
      - name: Integration tests
        run: pnpm --dir tools/contracts test:integration
        env:
          STOCKSENSE_STANDARDS_IMAGE: ${{ steps.standards-image.outputs.id }}
          STOCKSENSE_KIOTA_IMAGE: ${{ steps.kiota-image.outputs.id }}

      # The 80% U1 line floor is enforced here rather than merely reported;
      # a lower figure fails the job.
      - name: Coverage with the 80% line floor
        run: >
          node --experimental-test-coverage --test
          --test-concurrency=1
          --test-coverage-include='src/**/*.mjs'
          --test-coverage-lines=80
          test/unit/*.test.mjs test/integration/*.test.mjs
        working-directory: tools/contracts
        env:
          STOCKSENSE_STANDARDS_IMAGE: ${{ steps.standards-image.outputs.id }}
          STOCKSENSE_KIOTA_IMAGE: ${{ steps.kiota-image.outputs.id }}

  # Its own required job retains the secret and vulnerability findings even
  # when their gate fails, making current disposition reviewable.
  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the pull-request merge revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # A package records the commit its canonical bytes come from, and
          # provenance verification resolves that commit. A shallow clone has
          # only the merge head, so the recorded revision is absent and the
          # binding fails as SOURCE_REVISION_UNKNOWN - which is what the first
          # hosted run reported. Full history is a requirement here, not a
          # convenience.
          fetch-depth: 0
          persist-credentials: false

      - name: Pin pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: tools/contracts/pnpm-lock.yaml

      - name: Install from the frozen lockfile
        run: pnpm --dir tools/contracts install --frozen-lockfile

      - name: Produce sanitized secret scan report
        run: node tools/contracts/scripts/security-reports.mjs secret-scan

      - name: Produce vulnerability scan report
        if: always()
        run: node tools/contracts/scripts/security-reports.mjs vulnerability-scan

      - name: Retain exact scan report bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.sha }}
          path: tools/contracts/dist/security-reports/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Require current clean or approved finding-specific scans
        run: node tools/contracts/scripts/security-reports.mjs verify
