name: U1 isolated ledger and SBOM proof
on:
  push:
    branches: [codex/u1-ledger-proof]
    paths: ['.github/workflows/r15-noble-screen.yml', '.github/r15-noble/**', '.github/u1-ledger/**']
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE: 3fef097f5a7f87885d6453dfd3017ec23751a1b1
      SDK: mcr.microsoft.com/dotnet/sdk@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
      SYFT: ghcr.io/anchore/syft@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
      GRYPE: ghcr.io/anchore/grype@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 3fef097f5a7f87885d6453dfd3017ec23751a1b1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - name: Build production recipe through normal entrypoint
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/noble"/{proof,io,db}
          cd "$GITHUB_WORKSPACE/candidate/tools/contracts"
          img=$(node scripts/build-kiota-image.mjs)
          [[ "$img" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMG=$img" >> "$GITHUB_ENV"
          echo "STOCKSENSE_KIOTA_IMAGE=$img" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --target runtime-build -f Dockerfile.generator-kiota -t stocksense:runtime-proof .
          cut=$(docker create stocksense:runtime-proof)
          docker cp "$cut:/proof/." "$RUNNER_TEMP/noble/proof/"
          docker rm "$cut"
          cp Dockerfile.generator-kiota "$RUNNER_TEMP/noble/proof/Kiota.Dockerfile"
          cd "$RUNNER_TEMP/noble"
          docker image inspect "$img" | jq '.[0]|{Id,Architecture,Os,Config:{User:.Config.User,Entrypoint:.Config.Entrypoint,Cmd:.Config.Cmd,Env:.Config.Env}}' > proof/image.json
          c=$(docker create "$img")
          docker cp "$c:/var/lib/dpkg/status" proof/dpkg-status
          docker cp "$c:/var/lib/chisel/manifest.wall" proof/chisel-manifest.wall
          docker cp -L "$c:/etc/os-release" proof/os-release
          docker cp "$c:/opt/kiota/.store/microsoft.openapi.kiota/1.38.0/microsoft.openapi.kiota/1.38.0/microsoft.openapi.kiota.1.38.0.nupkg" io/tool.nupkg
          docker rm "$c"
          echo 'ec934c391c94e156543ce63cb497d6944180105b2b794b8b3a53a89b89cd4d82  io/tool.nupkg' | sha256sum -c -
          docker save -o io/kiota.tar "$img"
      - name: Exercise assembled runtime under offline limits
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/noble"
          guard=(--rm --pull=never --network none --user 65532:65532 --read-only --cap-drop ALL --security-opt no-new-privileges --cpus=1 --memory=2g --memory-swap=2g --pids-limit=128)
          docker run "${guard[@]}" "$IMG" --version | tee proof/kiota-version.txt
          grep -E '^1\.38\.0(\+|$)' proof/kiota-version.txt
          docker run "${guard[@]}" --entrypoint /usr/share/dotnet/dotnet "$IMG" /opt/kiota-probe/kiota-probe.dll --version 2>&1 | tee proof/probe.txt
          grep -E '^STOCKSENSE_GENERATOR_PEAK=[1-9][0-9]+$' proof/probe.txt
          docker run "${guard[@]}" --entrypoint /usr/share/dotnet/dotnet "$IMG" --list-runtimes | tee proof/net10.txt
          mkdir probe
          echo '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><UseAppHost>false</UseAppHost></PropertyGroup></Project>' > probe/Smoke.csproj
          cat > probe/Program.cs <<'CS'
          using System;
          using System.Globalization;
          if(Environment.GetEnvironmentVariable("DOTNET_LTTng")!="0" || Environment.GetEnvironmentVariable("COMPlus_LTTng")!="0") return 2;
          foreach(var line in System.IO.File.ReadLines("/proc/self/maps")) if(line.Contains("libcoreclrtraceptprovider") || line.Contains("liblttng-ust")) return 3;
          var jan = new DateTime(2026,1,15,12,0,0,DateTimeKind.Utc);
          var tz = TimeZoneInfo.FindSystemTimeZoneById("Asia/Jerusalem");
          var month = jan.ToString("MMMM",CultureInfo.GetCultureInfo("fr-FR"));
          if(month!="janvier" || tz.GetUtcOffset(jan).TotalHours!=2 || tz.GetUtcOffset(jan.AddMonths(6)).TotalHours!=3) return 1;
          Console.WriteLine("fr-FR janvier; Jerusalem January +02, July +03"); return 0;
          CS
          docker run --rm --network none -v "$PWD/probe:/probe" -w /probe "$SDK" dotnet publish -c Release -o /probe/out -p:RestoreIgnoreFailedSources=true
          docker run "${guard[@]}" -v "$PWD/probe:/probe:ro" --entrypoint /usr/share/dotnet/dotnet "$IMG" /probe/out/Smoke.dll | tee proof/globalization.txt
      - name: Verify active ELF dependencies and disabled optional LTTng
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/noble"
          jq -e '.Config.Env | index("DOTNET_LTTng=0")!=null and index("COMPlus_LTTng=0")!=null' proof/image.json
          curl -fL https://raw.githubusercontent.com/dotnet/runtime/a3788b71495457354b64ca8040b6ded5ff6ca4f9/src/coreclr/pal/src/misc/tracepointprovider.cpp -o proof/tracepointprovider.cpp
          echo '0961fc926da5e328500055f0e274cf92fb0b0a82bdcb902c799c01c2a6f06cc7  proof/tracepointprovider.cpp' | sha256sum -c -
          c=$(docker create "$IMG")
          docker export "$c" -o io/rootfs.tar
          docker rm "$c"
          mkdir io/rootfs
          tar -xf io/rootfs.tar -C io/rootfs
          docker run --rm --network none --read-only -v "$PWD/io/rootfs:/rootfs:ro" -v "$GITHUB_WORKSPACE/audit/.github/r15-noble:/checks:ro" python@sha256:2784af835b90070d9d37d3aa5aa01a3e825d88436b0d58f7776d2cdcb6780f9e python /checks/check_elf.py /rootfs > proof/elf.json
          python3 - <<'PY'
          import json,subprocess,os,pathlib
          results=[]
          for entry in json.loads(pathlib.Path('proof/elf.json').read_text())['elf']:
              if entry['disabledOptionalLttng']:
                  continue
              if not entry['needed']:
                  continue
              args=['docker','run','--rm','--network=none','--read-only','--cap-drop=ALL','--security-opt=no-new-privileges','--entrypoint','/lib64/ld-linux-x86-64.so.2',os.environ['IMG'],'--list',entry['path']]
              r=subprocess.run(args,capture_output=True,text=True,timeout=30)
              results.append({'path':entry['path'],'exitCode':r.returncode,'stdout':r.stdout,'stderr':r.stderr})
          pathlib.Path('proof/elf-loader.json').write_text(json.dumps(results,indent=2))
          assert results and all(r['exitCode']==0 for r in results), 'runtime loader closure failed'
          PY
      - name: Inventory exact archived image and scan exact inventory bytes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/noble"
          docker pull --platform linux/amd64 "$SYFT"
          docker pull --platform linux/amd64 "$GRYPE"
          mkdir io/temp && chmod 777 io/temp
          docker run --rm --network none --read-only --cpus=1 --memory=2g -v "$PWD/io/temp:/tmp" -e SYFT_CACHE_DIR=/tmp/cache -e SYFT_CHECK_FOR_APP_UPDATE=false -v "$PWD/io:/scan:ro" "$SYFT" docker-archive:/scan/kiota.tar -o cyclonedx-json@1.6 > io/syft.cdx.json
          jq --arg id "$IMG" --arg scanner "$SYFT" '.metadata.properties += [{name:"stocksense:imageId",value:$id},{name:"stocksense:scanner",value:$scanner}]' io/syft.cdx.json > proof/kiota.cdx.json
          grype=(docker run --rm --read-only --cpus=1 --memory=2g --tmpfs /tmp -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_CACHE_DIR=/db -v "$PWD/db:/db" -v "$PWD/proof:/proof:ro")
          chmod 777 db
          "${grype[@]}" "$GRYPE" db update
          "${grype[@]}" --network none -e GRYPE_DB_AUTO_UPDATE=false "$GRYPE" db status -o json > proof/grype-db.json
          jq -e '.valid==true and (.error|not)' proof/grype-db.json
          "${grype[@]}" --network none -e GRYPE_DB_AUTO_UPDATE=false "$GRYPE" sbom:/proof/kiota.cdx.json -o json > proof/grype-raw.json
          "${grype[@]}" --network none -e GRYPE_DB_AUTO_UPDATE=false "$GRYPE" sbom:/proof/kiota.cdx.json --distro ubuntu:24.04 -o json > proof/grype-noble-explicit.json
          jq -r '.matches[]|[.vulnerability.id,.vulnerability.severity,.artifact.name,.artifact.version,.vulnerability.fix.state, (.vulnerability.fix.versions|join(","))]|@tsv' proof/grype-raw.json > proof/findings.tsv
          python3 "$GITHUB_WORKSPACE/audit/.github/r15-noble/check_packages.py" proof > proof/package-reconciliation.json
          cat proof/package-reconciliation.json
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('proof/kiota.cdx.json').read_text())
          assert any(c.get('purl')=='pkg:nuget/MessagePack@2.5.307' for c in s['components'])
          assert any(c.get('name')=='libc6' and c.get('version')=='2.39-0ubuntu8.12' for c in s['components'])
          PY
          MOD="file://$GITHUB_WORKSPACE/candidate/tools/contracts/src/kiota-runtime-manifest.mjs" node --input-type=module -e "import fs from 'node:fs/promises'; const {collectKiotaRuntimeManifest}=await import(process.env.MOD); const sbom=JSON.parse(await fs.readFile('proof/kiota.cdx.json')); const m=await collectKiotaRuntimeManifest({imageId:process.env.IMG,sbom}); await fs.writeFile('proof/kiota.runtime.json',JSON.stringify(m,null,2));"
          jq '(.components[]|select(.name=="libc6" and (.purl|startswith("pkg:deb/ubuntu/libc6@"))))|=. + {version:"2.39-0ubuntu8.9",purl:(.purl|sub("2.39-0ubuntu8.12";"2.39-0ubuntu8.9"))}' proof/kiota.cdx.json > proof/control.cdx.json
          "${grype[@]}" --network none -e GRYPE_DB_AUTO_UPDATE=false "$GRYPE" sbom:/proof/control.cdx.json -o json > proof/control.grype.json
          jq -e 'any(.matches[]; .artifact.name=="libc6" and .artifact.version=="2.39-0ubuntu8.9" and (.vulnerability.fix.versions|index("2.39-0ubuntu8.12")!=null))' proof/control.grype.json
          cat proof/findings.tsv
          sha256sum proof/* > io/digests.txt
          cp io/digests.txt proof/
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - name: Verify all three consumer baselines and compile actual outputs
        run: node audit/.github/r15-noble/consumer-proof.mjs
      - name: Verify production lint types and full coverage
        working-directory: candidate/tools/contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e '402ace3b195c291a756ed230a24a73199ef8349a^{commit}'
          git cat-file -e 'b8be1e0bbc81cf43f1ab62cda02824ce03d70720^{commit}'
          git cat-file -e 'b8be1e0bbc81cf43f1ab62cda02824ce03d70720:contracts/samples/walking-skeleton/governance/example-fixture.json'
          pnpm install --frozen-lockfile
          dotnet tool restore
          pnpm setup:oasdiff
          validator=$(node scripts/build-standards-image.mjs)
          [[ "$validator" =~ ^sha256:[a-f0-9]{64}$ ]]
          export STOCKSENSE_STANDARDS_IMAGE="$validator"
          echo "STOCKSENSE_STANDARDS_IMAGE=$validator" >> "$GITHUB_ENV"
          echo "$validator" > "$RUNNER_TEMP/noble/proof/production-validator.txt"
          pnpm lint | tee "$RUNNER_TEMP/noble/proof/lint.txt"
          pnpm type-check | tee "$RUNNER_TEMP/noble/proof/types.txt"
          node --experimental-test-coverage --test --test-concurrency=1 --test-coverage-include='src/**/*.mjs' --test-coverage-lines=80 test/unit/*.test.mjs test/integration/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/noble/proof/coverage.txt"
      - name: Record production canonical C01 through C27 CLI and bundle
        working-directory: candidate/tools/contracts
        run: |
          set -euo pipefail
          export PKG=$(mktemp -d)
          export ROOT="$GITHUB_WORKSPACE/candidate"
          node --input-type=module -e "import {buildFullPackage} from './src/full-package.mjs'; const r=await buildFullPackage(process.env.ROOT,process.env.PKG); if(!r.manifest||r.problems.length) throw Error(JSON.stringify(r.problems));"
          node src/cli.mjs validate "$PKG" --repo-root ../.. > "$RUNNER_TEMP/noble/proof/canonical-cli.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises'; import assert from 'node:assert/strict';
          import {ALL_BOUNDARIES,canonicalJson,digest} from './src/package-loader.mjs';
          import {buildPackageBundle,verifyPackageBundle} from './src/package-bundle.mjs';
          import {validateBundledCandidate} from './src/candidate-provenance.mjs';
          const p=process.env.RUNNER_TEMP+'/noble/proof/';
          const result=JSON.parse(await fs.readFile(p+'canonical-cli.json'));
          assert.deepEqual(result.coveredBoundaries,ALL_BOUNDARIES);
          assert.equal(result.releaseReady,false);
          const bundle=verifyPackageBundle(await buildPackageBundle(process.env.PKG));
          const receipt=await validateBundledCandidate(bundle,process.env.ROOT,process.env.STOCKSENSE_STANDARDS_IMAGE);
          assert.equal(receipt.resultDigest,digest(Buffer.from(canonicalJson(result))));
          await fs.writeFile(p+'bundle-receipt.json',JSON.stringify({source:process.env.CANDIDATE,bundleDigest:bundle.artifactDigest,receipt},null,2));
          JS
      - name: Retain normal production image and security scans
        working-directory: candidate
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "Scan source: $actual; expected: $CANDIDATE"
          test "$actual" = "$CANDIDATE"
          # The diagnostic workflow SHA differs from the pinned source checkout.
          # Bind only this child process after independently checking its Git HEAD.
          GITHUB_SHA="$CANDIDATE" node tools/contracts/scripts/image-evidence.mjs build "$RUNNER_TEMP/noble/proof/images"
          node tools/contracts/scripts/security-reports.mjs secret-scan "$RUNNER_TEMP/noble/proof/security"
          node tools/contracts/scripts/security-reports.mjs vulnerability-scan "$RUNNER_TEMP/noble/proof/security"
          node "$GITHUB_WORKSPACE/audit/.github/u1-ledger/check-security.mjs"
      - name: Exercise simulated three-baseline ledger and independently bound SBOM
        working-directory: candidate/tools/contracts
        run: node "$GITHUB_WORKSPACE/audit/.github/u1-ledger/simulate-ledger.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u1-ledger-image-${{ matrix.lane }}
          path: ${{ runner.temp }}/noble/io/kiota.tar
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: u1-ledger-proof-${{ matrix.lane }}
          path: ${{ runner.temp }}/noble/proof/
          retention-days: 30
