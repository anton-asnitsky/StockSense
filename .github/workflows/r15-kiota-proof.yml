name: Verify integrated Kiota upgrade
on:
  push:
    branches: [codex/r15-kiota-proof-836fd77a]
    paths: [.github/workflows/r15-kiota-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        build: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: 836fd77abbe0daec025d8c471385681c0dc20a3c
      BASE: 402ace3b195c291a756ed230a24a73199ef8349a
      HEAD: 6638de5303c95c3a50fa66d550be33de4627c6a8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 836fd77abbe0daec025d8c471385681c0dc20a3c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integrated candidate
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET"
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git rev-parse HEAD^2)" = "$HEAD"
          mkdir -p "$RUNNER_TEMP/r15-proof"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/r15-proof/source.txt"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - name: Build both pinned images
        working-directory: tools/contracts
        run: |
          set -eu
          validator=$(node scripts/build-standards-image.mjs)
          kiota=$(node scripts/build-kiota-image.mjs)
          [[ "$validator" =~ ^sha256:[a-f0-9]{64}$ && "$kiota" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "STOCKSENSE_STANDARDS_IMAGE=$validator" >> "$GITHUB_ENV"
          echo "STOCKSENSE_KIOTA_IMAGE=$kiota" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$validator" "$kiota" > "$RUNNER_TEMP/r15-proof/image-ids.txt"
      - name: Restore pinned generators and differ
        run: |
          pnpm --dir tools/contracts install --frozen-lockfile
          dotnet tool restore
          dotnet tool run kiota -- --version | grep -E '^1\.38\.0([+]|$)'
          pnpm --dir tools/contracts setup:oasdiff
      - name: Reproduce each consumer and compare manifests
        working-directory: tools/contracts
        run: |
          node scripts/pin-generation.mjs
          node scripts/create-sample.mjs
          git diff --exit-code -- ../../contracts/samples/walking-skeleton
          cp ../../contracts/samples/walking-skeleton/governance/generation-profile.json "$RUNNER_TEMP/r15-proof/"
          node --test --test-concurrency=1 test/integration/generation.test.mjs test/integration/bounded-generation.test.mjs | tee "$RUNNER_TEMP/r15-proof/generation-tests.txt"
          grep -Eq '(#|ℹ) skipped 0' "$RUNNER_TEMP/r15-proof/generation-tests.txt"
      - name: Lint and type-check
        if: matrix.build == 1
        run: |
          pnpm --dir tools/contracts lint
          pnpm --dir tools/contracts type-check
      - name: Run full unit and integration coverage with the 80 percent floor
        if: matrix.build == 1
        working-directory: tools/contracts
        run: |
          node --experimental-test-coverage --test --test-concurrency=1 --test-coverage-include='src/**/*.mjs' --test-coverage-lines=80 test/unit/*.test.mjs test/integration/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/r15-proof/coverage.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kiota-proof-${{ matrix.build }}-836fd77a
          path: ${{ runner.temp }}/r15-proof/
          retention-days: 30
