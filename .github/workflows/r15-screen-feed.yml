name: R-15 Azure Linux feed verification
on:
  push:
    branches: [chore/r15-screen-azurelinux-836fd77]
    paths: [.github/workflows/r15-screen-feed.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact scanner DB, content and positive-control sensitivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence db/6 input
          gh run download 44119808498 -R anton-asnitsky/StockSense -n azurelinux-kiota-screen -D input
          curl -fsSL "$(jq -r .from input/grype-db.json)" -o db.tar.zst
          echo '3f0cbdbc9d40fb69eaeacec1869b27a8c74f1894108804ace8b7468513e2df07  db.tar.zst' | sha256sum -c -
          tar --zstd -xf db.tar.zst -C db/6
          find db -name '*.db' -ls
          python3 - <<'PY' | tee evidence/provider.txt
          import sqlite3, pathlib
          p=next(pathlib.Path('db').rglob('vulnerability.db'))
          c=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True)
          for t in ('providers','operating_systems','affected_package_handles','vulnerability_handles'):
              print(t,[r[1] for r in c.execute('pragma table_info('+t+')')])
          provider=list(c.execute("select * from providers where id='mariner'"));print(provider)
          rows=list(c.execute("select * from operating_systems where lower(name) in ('azurelinux','mariner')")); print(rows)
          q=" from affected_package_handles ah join operating_systems os on os.id=ah.operating_system_id join vulnerability_handles vh on vh.id=ah.vulnerability_id join packages pkg on pkg.id=ah.package_id where lower(os.name) in ('azurelinux','mariner') and os.major_version='3' and vh.provider_id='mariner'"
          print('Azure 3.0 affected-package rows',list(c.execute("select count(*)"+q)))
          print('Installed family sample',list(c.execute("select pkg.name,count(*)"+q+" and lower(pkg.name) in ('icu','glibc','openssl','openssl-libs') group by pkg.name")))
          assert provider and c.execute("select count(*)"+q).fetchone()[0]>0
          PY
          jq '(.components[]|select(.name=="icu" and (.purl//""|startswith("pkg:rpm/")))) |= (.version="72.1.0.3-1.azl3" | .purl |= sub("@72.1.0.3-2.azl3";"@72.1.0.3-1.azl3") | ."bom-ref" |= sub("@72.1.0.3-2.azl3";"@72.1.0.3-1.azl3"))' input/kiota.cdx.json > input/positive-control.json
          grype=ghcr.io/anchore/grype@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
          docker pull "$grype"
          mkdir cache
          docker run --rm --network none --tmpfs /tmp -e GRYPE_DB_CACHE_DIR=/db -v "$PWD/cache:/db" -v "$PWD/db.tar.zst:/archive.tar.zst:ro" "$grype" db import /archive.tar.zst
          docker run --rm --network none --read-only --tmpfs /tmp -e GRYPE_DB_AUTO_UPDATE=false -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_CACHE_DIR=/db -v "$PWD/cache:/db:ro" -v "$PWD/input:/input:ro" "$grype" sbom:/input/positive-control.json --distro azurelinux:3.0 -o json > evidence/positive-control-grype.json
          jq -e '[.matches[]|select(.artifact.name=="icu" and (.vulnerability.id=="CVE-2025-5222" or any(.relatedVulnerabilities[]?; .id=="CVE-2025-5222")))]|length>0' evidence/positive-control-grype.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: azurelinux-db-coverage
          path: evidence
          retention-days: 30
