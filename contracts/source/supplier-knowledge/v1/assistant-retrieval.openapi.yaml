openapi: 3.1.2
info:
  title: Supplier Knowledge Assistant Tools API
  version: 1.0.0
paths:
  /api/v1/retailers/{retailerId}/assistant-tools/supplier-search:
    parameters:
      - in: path
        name: retailerId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: searchSupplierEvidence
      responses:
        "200":
          description: Authorized chunks with document, source revision, page and score citations
        "409":
          description: Retrieval index is stale, rebuilding or incompatible
  /api/v1/retailers/{retailerId}/assistant-tools/compare-suppliers:
    parameters:
      - in: path
        name: retailerId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: compareAcceptedSupplierTerms
      responses:
        "200":
          description: Deterministic comparison of accepted terms with citations
        "422":
          description: Comparable accepted terms are incomplete
servers:
  - url: /
security:
  - serviceToken: []
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-contract-operation-examples:
  - operationId: searchSupplierEvidence
    name: authorized-cited-search
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
    responseStatus: '200'
  - operationId: searchSupplierEvidence
    name: stale-retrieval-index
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
    responseStatus: '409'
  - operationId: compareAcceptedSupplierTerms
    name: accepted-terms-comparison
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
    responseStatus: '200'
  - operationId: compareAcceptedSupplierTerms
    name: incomplete-comparable-terms
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
    responseStatus: '422'
