openapi: 3.1.2
info:
  title: Retail Data Supplier-Knowledge API
  version: 1.0.0
servers:
  - url: /
security:
  - serviceToken: []
paths:
  /api/v1/retailers/{retailerId}/supplier-reference:
    get:
      operationId: getSupplierReferenceData
      description: The Retail Data provider validates current retailer membership and placement generation.
      parameters:
        - in: path
          name: retailerId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: productIds
          schema:
            type: array
            items: { type: string, format: uuid }
            maxItems: 200
      responses:
        '200':
          description: Authorized retailer currency, products and source versions
        '403':
          description: Current membership or placement validation failed
        '409':
          description: Requested source version is stale
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-contract-operation-examples:
  - operationId: getSupplierReferenceData
    name: authorized-products
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      query: { productIds: [00000000-0000-4000-8000-000000000102] }
    responseStatus: '200'
  - operationId: getSupplierReferenceData
    name: retailer-authority-denied
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
    responseStatus: '403'
  - operationId: getSupplierReferenceData
    name: stale-source-version
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
    responseStatus: '409'
