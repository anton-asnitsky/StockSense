openapi: 3.1.2
info:
  title: Retail Data Model-Lifecycle Export API
  version: 1.0.0
servers:
  - url: /
security:
  - serviceToken: []
paths:
  /api/v1/retailers/{retailerId}/dataset-exports:
    post:
      operationId: requestRetailDatasetExport
      parameters:
        - in: path
          name: retailerId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Immutable export job accepted; Location identifies the job resource
          headers:
            Location:
              schema: { type: string }
        '409':
          description: Idempotency conflict or stale source version
  /api/v1/retailers/{retailerId}/dataset-exports/{jobId}:
    parameters:
      - in: path
        name: retailerId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: jobId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRetailDatasetExport
      responses:
        '200':
          description: Job status and checksummed artifact reference
        '404':
          description: Job not visible in this retailer context
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-contract-operation-examples:
  - operationId: requestRetailDatasetExport
    name: export-job-accepted
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-export-request-0001 }
    responseStatus: '202'
  - operationId: requestRetailDatasetExport
    name: idempotency-payload-conflict
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-export-request-0001 }
    responseStatus: '409'
  - operationId: getRetailDatasetExport
    name: export-job-status
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101, jobId: 00000000-0000-4000-8000-000000000103 }
    responseStatus: '200'
  - operationId: getRetailDatasetExport
    name: job-not-visible-in-retailer
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101, jobId: 00000000-0000-4000-8000-000000000104 }
    responseStatus: '404'
