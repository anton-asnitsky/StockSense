        recoveryGeneration:
          type: integer
          minimum: 1
        terminalReason:
          enum:
            - completed
            - failed
            - cancelled
            - recovery-fenced
      additionalProperties: false
    ForecastRouteDrainRequest:
      type: object
      required:
        - expectedPromotionGeneration
        - placementGeneration
        - recoveryGeneration
        - purpose
      properties:
        expectedPromotionGeneration:
          type: integer
          minimum: 0
        placementGeneration:
          type: integer
          minimum: 1
        recoveryGeneration:
          type: integer
          minimum: 1
        purpose:
          enum:
            - promote
            - rollback
      additionalProperties: false
    ForecastRouteDrain:
      type: object
      required:
        - drainId
        - retailerId
        - expectedPromotionGeneration
        - placementGeneration
        - recoveryGeneration
        - purpose
        - status
        - deadlineAt
        - outstandingPinCount
        - evaluationRequestId
        - evaluationLeaseId
      properties:
        drainId:
          type: string
          format: uuid
        retailerId:
          type: string
          format: uuid
        expectedPromotionGeneration:
          type: integer
          minimum: 0
        placementGeneration:
          type: integer
          minimum: 1
        recoveryGeneration:
          type: integer
          minimum: 1
        purpose:
          enum:
            - promote
            - rollback
        status:
          enum:
            - draining
            - committed
            - aborted
            - recovery-required
        deadlineAt:
          type: string
          format: date-time
        outstandingPinCount:
          type: integer
          minimum: 0
        evaluationRequestId:
          type:
            - string
            - "null"
          format: uuid
        evaluationLeaseId:
          type:
            - string
            - "null"
          format: uuid
      additionalProperties: false
    ForecastRouteDrainAbort:
      type: object
      required:
        - expectedPromotionGeneration
        - placementGeneration
        - recoveryGeneration
        - reason
      properties:
        expectedPromotionGeneration:
          type: integer
          minimum: 0
        placementGeneration:
          type: integer
          minimum: 1
        recoveryGeneration:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      additionalProperties: false
    ForecastRouteChangeResult:
      type: object
      required:
        - decisionId
        - drainId
        - retailerId
        - modelReleaseId
        - promotionGeneration
        - evaluationRequestId
        - evaluationLeaseId
        - evaluationTerminalResultId
        - evaluationResultDigest
        - evaluationLeaseStatus
        - placementGeneration
        - recoveryGeneration
      properties:
        decisionId:
          type: string
          format: uuid
        drainId:
          type: string
          format: uuid
        retailerId:
          type: string
          format: uuid
        modelReleaseId:
          type: string
          format: uuid
        promotionGeneration:
          type: integer
          minimum: 1
        evaluationRequestId:
          type: string
          format: uuid
        evaluationLeaseId:
          type: string
          format: uuid
        evaluationTerminalResultId:
          type: string
          format: uuid
        evaluationResultDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        evaluationLeaseStatus:
          const: completed
        placementGeneration:
          type: integer
          minimum: 1
        recoveryGeneration:
          type: integer
          minimum: 1
      additionalProperties: false
