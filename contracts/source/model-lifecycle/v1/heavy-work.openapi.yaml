        - promotionGeneration
        - placementGeneration
        - recoveryGeneration
        - modelReleaseId
        - promotionDecisionId
        - modelKind
        - evaluationSummaryReference
        - evaluationEvidenceDigest
        - inputSchemaDigest
        - outputSchemaDigest
        - activatedAt
        - package
      properties:
        pinId:
