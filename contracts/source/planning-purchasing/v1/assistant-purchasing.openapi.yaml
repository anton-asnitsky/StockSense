openapi: 3.1.2
info:
  title: Planning-Purchasing Assistant Tools API
  version: 1.0.0
paths:
  /api/v1/retailers/{retailerId}/assistant-tools/reviews:request:
    parameters:
      - in: path
        name: retailerId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestManualReviewForAssistant
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Review accepted with job ID, remaining allowance and reset time
        "409":
          description: A review is already active or idempotency payload differs
        "429":
          description: Three accepted manual requests used for the retailer-local day
  /api/v1/retailers/{retailerId}/assistant-tools/purchase-drafts:
    parameters:
      - in: path
        name: retailerId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createPurchaseDraftForAssistant
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Governed draft created; no order is submitted or approved
        "403":
          description: Current actor lacks planner authority
        "422":
          description: Proposed lines or evidence failed deterministic validation
servers:
  - url: /
security:
  - serviceToken: []
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-contract-operation-examples:
  - operationId: requestManualReviewForAssistant
    name: review-request-accepted
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-review-request-0001 }
    responseStatus: '202'
  - operationId: requestManualReviewForAssistant
    name: active-review-conflict
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-review-request-0002 }
    responseStatus: '409'
  - operationId: requestManualReviewForAssistant
    name: daily-review-quota-exhausted
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-review-request-0003 }
    responseStatus: '429'
  - operationId: createPurchaseDraftForAssistant
    name: governed-draft-created
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-draft-request-0001 }
    responseStatus: '201'
  - operationId: createPurchaseDraftForAssistant
    name: planner-authority-denied
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-draft-request-0002 }
    responseStatus: '403'
  - operationId: createPurchaseDraftForAssistant
    name: invalid-draft-evidence
    request:
      path: { retailerId: 00000000-0000-4000-8000-000000000101 }
      headers: { Idempotency-Key: synthetic-draft-request-0003 }
    responseStatus: '422'
