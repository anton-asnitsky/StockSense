# C24-C27 governed sidecar candidate. It states the coordination surfaces the
# recovery boundaries expose and the objective targets recovery evidence is
# assessed against. It is not a passing recovery result, and it does not make
# a recovery acceptance claim: see objectiveAssessment below.
kind: recovery-policy
version: 1.0.0
boundaries: [C24, C25, C26, C27]

# Described from the canonical sources, not invented here. Each entry names the
# surface its boundary already declares.
coordination:
  C24:
    source: recovery-coordination/v1/bootstrap-participant.openapi.yaml
    surface: internal participant command and restore-attestation routes, scoped
      per participant, retailer and run
    authority: the control plane issues commands; a participant answers for its
      own restore only
  C25:
    source: recovery-coordination/v1/participant-protocol.asyncapi.yaml
    channels:
      command: stocksense.recovery.command.v1.{participant}
      acknowledgement: stocksense.recovery.acknowledgement.v1
      restoreAttestation: stocksense.recovery.restore-attestation.v1
    envelope: the C01 tenant message envelope, so a recovery message carries the
      same identity, correlation and idempotency fields as any other
  C26:
    source: recovery-coordination/v1/control-status.openapi.yaml
    surface: participant registration, and retailer-scoped recovery-run preview,
      creation, status, reconciliation and manifest
    authority: a recovery run is addressed by retailer and run id; status is read
      from the control plane rather than from a participant
  C27:
    source: recovery-coordination/v1/recovery-audit.asyncapi.yaml
    channel: stocksense.recovery.event.v1
    authority: audit events are append-only and are not a substitute for the
      run manifest C26 publishes

# OQ5, partly resolved by owner decision on 2026-10-08.
#
# Three targets are now confirmed. They are not the constants the contract used
# to carry: those were struck as invented, and these are a fresh decision that
# happens to agree on two of the three figures.
#
# rtoSeconds is scoped. The owner chose four hours, and the four-hour figure in
# the design belongs specifically to the documented clean-cluster restore, which
# is the path C24-C27 coordinate. Eleven units' approved NFR requirements state
# a two-hour RTO for their own in-place recovery, in 31 places; that remains
# their figure and is not overridden here. A single global four-hour RTO would
# require reconciling all of those, which has not been decided.
#
# totalDiskGiB stays null by the owner's choice to measure before deciding. The
# recorded condition is that an objective-based pass is prevented until the
# owner confirms targets *and* U13 measures the full local footprint, and U13
# has no code yet. A number here would be a guess indistinguishable from a
# measurement once it reached evidence.
objectiveTargets:
  rpoSeconds: 86400
  rtoSeconds: 14400
  backupExpiryDays: 30
  totalDiskGiB: null

rtoScope: documented-clean-cluster-restore
objectiveDecision:
  decidedOn: 2026-10-08
  openPrerequisite: >-
    totalDiskGiB awaits a measured full local footprint from U13; until it is
    measured no objective-based recovery check may report a pass.

# The same vocabulary the C19 demo-evidence manifest uses for this case. One
# target is still null, so a drill assessed against these objectives reports
# not-run rather than a pass. This value changes only when the footprint is
# measured and totalDiskGiB is set.
objectiveAssessment: not-run-missing-objectives

limitations:
  - totalDiskGiB is unset, so no drill assessed against this policy may report
    passed; the measured footprint is a prerequisite, not a formality.
  - The four-hour RTO is the clean-cluster restore objective. It does not
    relax the two-hour in-place RTO that eleven units' approved NFR
    requirements state for themselves.
  - This sidecar satisfies the C24-C27 required-kind inventory for a candidate
    package. It is not evidence that a restore drill ran, and it carries no
    measured duration, data loss, backup age or disk footprint.
  - Participant and control-plane implementations do not exist yet; the
    surfaces above are declared contracts, not deployed behaviour.
