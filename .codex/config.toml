# StockSense AI-DLC integration; inherit the user's model and provider.
# Keep permissions and network policy under host/user control.
[shell_environment_policy]
set = { AIDLC_RULES_DIR = "aidlc/spaces/default/memory" }

[agents]
max_depth = 1

# AI-DLC protected approval checkpoints need the native choice prompt in
# interactive Codex CLI sessions. Keep this project-local; other repos are unaffected.
[features]
default_mode_request_user_input = true
